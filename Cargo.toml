[package]
name = "trit-vs-binary"
version = "0.1.0"
edition = "2021"
description = "三进制 vs 二进制 · GPU 位并行筛选对比"
publish = false

[dependencies]
wgpu = "30"
pollster = "1.0"
winit = "0.30"

[[bin]]
name = "trit_visibility"
path = "src/bin/trit_visibility.rs"

[[bin]]
name = "trit_gui"
path = "src/bin/trit_gui.rs"

[[bin]]
name = "gpu_bw"
path = "src/bin/gpu_bw.rs"

[profile.release]
opt-level = 3
lto = "thin"
